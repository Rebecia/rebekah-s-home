<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal KB 统计侧栏 · demo</title>
<style>
/* v3 — token 先立住，视图只准引用 token，不准自己写数值。
   排版按中文优先：SF + PingFang 是 macOS 上成套设计的搭配，中文字距归零。
   v1 软 UI 磁贴存档在 media/versions/v1-soft-ui/ */

:root {
  /* 面 */
  --page: #eaecee;
  --glass: rgba(255, 255, 255, .74);
  --glass-2: rgba(255, 255, 255, .5);
  --edge: rgba(255, 255, 255, .92);
  --hair: rgba(20, 22, 26, .1);
  --hair-strong: rgba(20, 22, 26, .2);

  /* 字色只三档，别再加 */
  --ink: #14161a;
  --mute: #6f757d;
  --faint: #9ba1a8;

  --dark: #15171b;
  --on-dark: #f7f8f8;
  --amber: #e2900f;

  /* 阴影只两档 */
  --sh-1: 0 1px 2px rgba(20, 22, 26, .04);
  --sh-2: 0 1px 2px rgba(20, 22, 26, .04), 0 12px 32px rgba(20, 22, 26, .08);

  /* 圆角只两档 */
  --r-md: 14px;
  --r-lg: 20px;

  /* 间距 8pt 阶梯 */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  /* 字号只五档 */
  --t-hero: 28px;
  --t-h1: 20px;
  --t-h2: 15px;
  --t-body: 13px;
  --t-note: 11px;

  --font: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --num: "SF Mono", ui-monospace, "PingFang SC", monospace;
}

body.vscode-dark {
  --page: #191b1e;
  --glass: rgba(255, 255, 255, .062);
  --glass-2: rgba(255, 255, 255, .035);
  --edge: rgba(255, 255, 255, .11);
  --hair: rgba(255, 255, 255, .11);
  --hair-strong: rgba(255, 255, 255, .24);
  --ink: #eef0f2;
  --mute: #949aa1;
  --faint: #6e747b;
  --dark: #eef0f2;
  --on-dark: #17191b;
  --amber: #f0a83a;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .38);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.7;              /* 中文要更松 */
  letter-spacing: 0;             /* 中文不收字距 */
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* 光纹压得比上一版淡，别糊住文字 */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(112deg, transparent 36%, rgba(226,144,15,.10) 45%, rgba(255,255,255,.42) 50%, rgba(226,144,15,.07) 55%, transparent 64%),
    radial-gradient(60% 40% at 6% 8%, rgba(255,255,255,.6), transparent 70%);
}
body.vscode-dark::before { opacity: .42; }
#app { position: relative; z-index: 1; }

* { box-sizing: border-box; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* 数字用等宽，紧一点，才有仪表感 */
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* 统一的磨砂面 */
.pane {
  background: var(--glass);
  border: 1px solid var(--hair);
  border-top-color: var(--edge);
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  backdrop-filter: blur(20px) saturate(1.3);
}
.pane.raised { box-shadow: var(--sh-2); }

/* 类型图标：圆角方框 + 单字，单色 */
.badge {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 1px solid var(--hair);
  background: var(--glass-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  color: var(--mute);
  flex: none;
}
.badge.pitfall { color: var(--amber); border-color: rgba(226,144,15,.42); }

.pill {
  border: 1px solid transparent;
  background: transparent;
  color: var(--mute);
  border-radius: 999px;
  padding: 5px var(--s3);
  font-size: var(--t-note);
  line-height: 1.4;
  white-space: nowrap;
}
.pill:hover { color: var(--ink); }
.pill.on {
  background: var(--glass);
  border-color: var(--hair);
  color: var(--ink);
  font-weight: 600;
}

.go {
  border: 0;
  background: var(--dark);
  color: var(--on-dark);
  border-radius: 999px;
  padding: 9px var(--s4);
  font-size: var(--t-note);
  font-weight: 600;
  line-height: 1.4;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.go::after { content: "→"; }
.go.plain::after { content: none; }
.ghost {
  background: var(--glass);
  border: 1px solid var(--hair);
  color: var(--ink);
  border-radius: 999px;
  padding: 9px var(--s4);
  font-size: var(--t-note);
  line-height: 1.4;
}
.ghost:hover { border-color: var(--hair-strong); }

/* 首次使用引导：没指目录、或目录里还没有卡片时显示 */
.onboard { padding: var(--s5) var(--s4); }
.onboard h3 {
  margin: 0 0 var(--s2);
  font-size: var(--t-h2);
  font-weight: 600;
  line-height: 1.5;
}
.onboard p {
  margin: 0 0 var(--s4);
  color: var(--mute);
  font-size: var(--t-note);
  line-height: 1.75;
}
.onboard .acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
.onboard code {
  font-family: var(--num);
  font-size: 10px;
  background: var(--glass-2);
  border: 1px solid var(--hair);
  border-radius: 6px;
  padding: 1px 5px;
  word-break: break-all;
}
/* 格式说明里的短 code 不许断词，否则窄侧栏里会裂成两半 */
.onboard .fmt code { word-break: keep-all; white-space: nowrap; }
.onboard .fmt {
  margin: var(--s4) 0 0;
  padding-top: var(--s4);
  border-top: 1px solid var(--hair);
  color: var(--faint);
}

body { padding: var(--s4) var(--s3) var(--s5); }

.stack { display: flex; flex-direction: column; gap: var(--s3); }

/* hero */
.hero { padding: var(--s5) var(--s4); }
.tagline {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--s2);
  background: var(--glass-2);
  border: 1px solid var(--hair);
  border-radius: var(--r-md);
  padding: 6px 10px;
  font-size: var(--t-note);
  line-height: 1.6;
  color: var(--mute);
  margin-bottom: var(--s4);
}
.tagline i { color: var(--amber); font-style: normal; line-height: 1.6; }
.hero h1 {
  margin: 0 0 var(--s2);
  font-size: var(--t-h1);
  line-height: 1.4;
  font-weight: 600;
}
.hero p {
  margin: 0 0 var(--s4);
  color: var(--mute);
  font-size: var(--t-note);
  line-height: 1.75;
}

/* 三段指标 */
.strip { display: flex; padding: var(--s4) var(--s1); }
.strip .cell { flex: 1; padding: 0 var(--s3); min-width: 0; }
.strip .cell + .cell { border-left: 1px solid var(--hair); }
.cell .n { display: block; font-size: var(--t-h1); font-weight: 600; line-height: 1.2; }
.cell .n.warn { color: var(--amber); }
.cell .k { display: block; color: var(--faint); font-size: var(--t-note); margin-top: var(--s1); line-height: 1.4; }

/* 分类分布 */
.block { padding: var(--s4); }
.block h2 {
  margin: 0 0 var(--s4);
  font-size: var(--t-h2);
  font-weight: 600;
  line-height: 1.4;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2);
}
.block h2 span { color: var(--faint); font-weight: 400; font-size: var(--t-note); }

.row { display: flex; align-items: center; gap: var(--s3); padding: 5px 0; }
.row .lb { font-size: var(--t-note); width: 44px; flex: none; color: var(--mute); }
.row .v { font-size: var(--t-note); color: var(--mute); width: 16px; text-align: right; }

/* 饼图：单色灰阶 + 最大一块用琥珀 */
.pie-wrap {
  display: flex;
  align-items: center;
  gap: var(--s4);
  --sl1: #e2900f;
  --sl2: rgba(20, 22, 26, .74);
  --sl3: rgba(20, 22, 26, .56);
  --sl4: rgba(20, 22, 26, .40);
  --sl5: rgba(20, 22, 26, .26);
  --sl6: rgba(20, 22, 26, .14);
}
body.vscode-dark .pie-wrap {
  --sl1: #f0a83a;
  --sl2: rgba(238, 240, 242, .82);
  --sl3: rgba(238, 240, 242, .62);
  --sl4: rgba(238, 240, 242, .44);
  --sl5: rgba(238, 240, 242, .28);
  --sl6: rgba(238, 240, 242, .16);
}

.pie {
  width: 92px;
  height: 92px;
  flex: none;
  border-radius: 50%;
  /* 挖成环形，中间留白放总数 */
  mask: radial-gradient(circle at 50% 50%, transparent 0 52%, #000 53%);
  -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0 52%, #000 53%);
}
.pie-hole {
  position: relative;
  width: 92px;
  height: 92px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pie-hole .pie { position: absolute; inset: 0; }
.pie-hole .mid { text-align: center; line-height: 1.25; }
.pie-hole .mid b { display: block; font-size: var(--t-h2); font-weight: 600; }
.pie-hole .mid span { font-size: var(--t-note); color: var(--faint); }

.legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.legend .li { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-note); }
.legend .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.legend .nm { color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .ct { margin-left: auto; color: var(--faint); }


/* 连接器 */
.conn { padding: var(--s4); }
.conn .line { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s4); }
.conn .name { font-size: var(--t-h2); font-weight: 600; }
.conn .state { margin-left: auto; font-size: var(--t-note); color: var(--faint); }
.conn .state.ok { color: var(--amber); }
.conn .go { width: 100%; justify-content: center; }

.path {
  color: var(--faint);
  font-size: var(--t-note);
  line-height: 1.6;
  word-break: break-all;
  padding: 0 var(--s1);
}


.demobar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 16px;
  font-size: 11px;
  color: var(--mute);
  background: var(--glass);
  border-bottom: 1px solid var(--hair);
  backdrop-filter: blur(20px);
}
.demobar b { color: var(--ink); font-weight: 600; }
.demobar .sep { color: var(--faint); }
.demobar a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--hair); }
.demobar a:hover, .demobar a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.demobar .right { margin-left: auto; }
body.bare .demobar { display: none; }

html, body { min-height: 100vh; }
#app { width: 360px; margin: 0 auto; }
</style>
</head>
<body>
<header class="demobar">
  <b>Personal KB</b>
  <span class="sep">示例数据，可以随便点</span>

  </span>

<div id="app"></div>
<script>
// 拍图时 ?bare=1 隐藏说明栏
if (new URLSearchParams(location.search).has('bare')) document.body.classList.add('bare');
</script>
<script>
window.acquireVsCodeApi = () => ({ postMessage: () => {} });
</script>
<script>
const vscode = acquireVsCodeApi();
const TYPE_LABEL = {
  thinking: '思考',
  fundamentals: '基本功',
  idea: 'Idea',
  pitfall: '易错',
  life: '人生',
  glossary: '术语'
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('message', event => {
  if (event.data?.type !== 'render') return;
  const { stats, connectors, kbPath, kbExists } = event.data.payload;

  // 没指目录 / 目录里还没有卡片：给引导，不给空仪表盘
  if (!kbExists || !(stats.total > 0)) {
    document.getElementById('app').innerHTML = `
      <div class="stack">
        <section class="pane onboard">
          <h3>还没有卡片</h3>
          <p>在 AI 助手里说一句「沉淀本次」，卡片会自动写到<br><code>${esc(kbPath || '')}</code></p>
          <div class="acts">
            <button class="go" data-cmd="personalKb.connectAgents">接入 AI 助手</button>
            <button class="ghost" data-cmd="personalKb.createSampleCard">先看张示例</button>
          </div>
          <p class="fmt">接入会往 Comate / Claude Code / Codex / Cursor 的指令文件写一段「怎么沉淀」，随时可以移除。也可以自己手写卡片：frontmatter 写 <code>title</code> / <code>type</code> / <code>tags</code> / <code>created</code>，正文写「结论 / 为什么重要 / 怎么用 / 反例」。</p>
        </section>
      </div>
    `;
    return;
  }

  const types = (stats.byType || []).filter(x => x.count).sort((a, b) => b.count - a.count).slice(0, 6);
  const sum = types.reduce((n, x) => n + x.count, 0) || 1;
  let acc = 0;
  const stops = types.map((x, i) => {
    const from = (acc / sum) * 100;
    acc += x.count;
    const to = (acc / sum) * 100;
    return `var(--sl${i + 1}) ${from.toFixed(2)}% ${to.toFixed(2)}%`;
  }).join(', ');
  const legend = types.map((x, i) => `
    <div class="li">
      <span class="dot" style="background:var(--sl${i + 1})"></span>
      <span class="nm">${esc(TYPE_LABEL[x.type] || x.type)}</span>
      <span class="ct num">${x.count}</span>
    </div>`).join('');
  const pie = types.length
    ? `<div class="pie-wrap">
        <div class="pie-hole">
          <div class="pie" style="background: conic-gradient(${stops})"></div>
          <div class="mid"><b class="num">${sum}</b><span>张</span></div>
        </div>
        <div class="legend">${legend}</div>
      </div>`
    : `<div class="row"><span class="lb">还没有</span></div>`;
  const obsidian = (connectors || []).find(c => c.id === 'obsidian') || {};
  const linked = !!obsidian.linked;
  const due = stats.duePitfalls || 0;

  document.getElementById('app').innerHTML = `
    <div class="stack">
      <section class="pane hero">
        <div class="tagline"><i>◆</i> 忙完说一句「沉淀本次」，知识库就厚一点</div>
        <h1>你的知识库</h1>
        <p>思考、基本功、idea、易错点，按类型攒在一处，随时回看。</p>
        <button class="go" data-cmd="personalKb.openWall">打开卡片墙</button>
      </section>

      <section class="pane strip">
        <div class="cell"><span class="n num">${stats.total || 0}</span><span class="k">已沉淀</span></div>
        <div class="cell"><span class="n num">${stats.createdThisWeek || 0}</span><span class="k">本周新写</span></div>
        <div class="cell"><span class="n num ${due ? 'warn' : ''}">${due}</span><span class="k">待复习</span></div>
      </section>

      <section class="pane block">
        <h2>分类分布 <span>${stats.tagCount || 0} 个标签</span></h2>
        ${pie}
      </section>

      <section class="pane conn">
        <div class="line">
          <div class="badge">Ob</div>
          <span class="name">Obsidian</span>
          <span class="state ${linked ? 'ok' : ''}">${linked ? '已连接' : '未连接'}</span>
        </div>
        <button class="go plain" data-link="obsidian">${linked ? '重新选择 vault' : '连接 vault'}</button>
      </section>

      <div class="path">${esc(kbPath || '')}</div>
    </div>
  `;
});

document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof HTMLElement)) return;
  const hit = t.closest('button');
  if (!hit) return;
  if (hit.dataset.link === 'obsidian') { vscode.postMessage({ type: 'linkObsidian' }); return; }
  if (hit.dataset.cmd) { vscode.postMessage({ type: 'cmd', id: hit.dataset.cmd }); }
});

vscode.postMessage({ type: 'ready' });

</script>

window.postMessage({ type: 'render', payload: {"cards":[{"id":"demo/0.md","title":"需求评审先对齐口径，再谈方案","type":"fundamentals","created":"2026-08-26","tags":["需求","评审"],"conclusion":"评审吵不出结果，八成不是方案分歧，是同一个指标两边算法不同。先把口径写在白板上，再讨论方案。","why":"口径不一致时，双方都在用自己的数字证明自己对，讨论无法收敛。","how":"开场五分钟先念一遍指标定义和统计范围。","pitfall":"直接进方案讨论，一小时后发现两边说的\"转化率\"分母不一样。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/1.md","title":"Agent 产品的评测要分层","type":"thinking","created":"2026-08-24","tags":["Agent","评测"],"conclusion":"把端到端成功率拆成\"意图识别 / 工具调用 / 结果组织\"三层，才知道该改哪一层。","why":"只看端到端指标，回归时无法定位是哪一环退化。","how":"每层单独打分并留 badcase 样本集。","pitfall":"只报一个 78% 成功率，下一版降到 74% 却查不出原因。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/2.md","title":"UTR","type":"glossary","created":"2026-08-22","tags":["指标","口径"],"conclusion":"Unique Trigger Rate，去重后触发过某功能的用户占比，分母是有机会触发的用户，不是全量用户。","why":"分母取错会让数字虚高一倍以上。","how":"算之前先确认\"有机会触发\"的判定条件。","pitfall":"拿 DAU 当分母，导致低估功能渗透。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/3.md","title":"把复习做成到期提醒，而不是列表","type":"idea","created":"2026-08-20","tags":["知识管理"],"conclusion":"易错点卡片加一个 review_after 日期，到期才出现在\"待复习\"，避免每次打开都面对全量列表。","why":"全量列表会让人放弃复习，到期制把复习变成有限任务。","how":"写卡时顺手填一个日期，一周或一个月后。","pitfall":"把 200 张卡列成一页，指望自己每天翻。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/4.md","title":"先量后砍：需求排期用数据止损","type":"fundamentals","created":"2026-08-18","tags":["排期"],"conclusion":"排期争不下来时，先给每个需求配一个可观测指标和放弃条件，再决定先做哪个。","why":"有放弃条件的需求可以试错，没有的只能一路做到底。","how":"每个需求写一行\"若两周后 X 未达 Y，则停\"。","pitfall":"按老板关注度排序，做完没人回看效果。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/5.md","title":"文档协作别动别人的内容","type":"pitfall","created":"2026-08-16","tags":["协作"],"conclusion":"往共享文档补内容时，填进已有结构里，不改写他人段落，不重排他人表格。","why":"改写会覆盖别人的上下文，也让 diff 无法review。","how":"新增内容单独成行或成列，保留原结构。","pitfall":"为了\"整理得更清楚\"重排整张表，作者找不到自己写的东西。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/6.md","title":"判断要不要做，先问谁会因此改变行为","type":"thinking","created":"2026-08-14","tags":["判断"],"conclusion":"一个功能如果说不出\"谁的哪个动作会变\"，通常是想象出来的需求。","why":"行为变化是唯一能观测的收益来源。","how":"写一句\"某角色原来做 A，之后会做 B\"。","pitfall":"用\"提升体验\"当收益描述，上线后没有指标可看。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/7.md","title":"把决定写下来，比记住它更省事","type":"life","created":"2026-08-12","tags":["方法"],"conclusion":"任何需要第二次解释的决定，都值得写一段话记下当时的约束和取舍。","why":"人只记得结论，忘记约束，于是下次会推翻一个其实正确的决定。","how":"记三行：决定、当时的约束、放弃了什么。","pitfall":"半年后重新讨论同一个问题，且没人记得为什么当初这么定。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/8.md","title":"指标别只看均值","type":"fundamentals","created":"2026-08-10","tags":["指标","分析"],"conclusion":"看均值的同时至少看一个分位数（P50 / P90），均值会被长尾拖着走。","why":"均值改善但 P90 恶化，意味着一部分用户体验在变差。","how":"看板上给关键指标同时放均值和 P90。","pitfall":"平均耗时下降就宣布优化成功，实际上重度用户变慢了。","source":"示例数据","origin":"示例数据","reviewAfter":""},{"id":"demo/9.md","title":"需求文档的\"不做什么\"和\"要做什么\"一样重要","type":"pitfall","created":"2026-08-08","tags":["需求","PRD"],"conclusion":"PRD 里显式写一节\"本期不做\"，能挡住一半的范围蔓延。","why":"不写就要靠口头共识，而口头共识在下一次会议就失效。","how":"每份 PRD 固定留\"明确不做\"小节，逐条列。","pitfall":"只写要做的，评审时被追加三个\"顺便\"。","source":"示例数据","origin":"示例数据","reviewAfter":""}],"stats":{"total":10,"byType":[{"type":"thinking","count":2},{"type":"fundamentals","count":3},{"type":"idea","count":1},{"type":"pitfall","count":2},{"type":"life","count":1},{"type":"glossary","count":1}],"createdThisWeek":2,"duePitfalls":1,"tagCount":14},"connectors":[{"id":"obsidian","linked":true}],"kbPath":"~/Personal-KB","kbExists":true,"filterType":"all"} }, '*');
