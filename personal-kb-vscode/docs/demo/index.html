<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal KB 卡片墙 · 在线 demo</title>
<style>
/* v3 — token 先立住，视图只准引用 token，不准自己写数值。
   排版按中文优先：SF + PingFang 是 macOS 上成套设计的搭配，中文字距归零。
   v1 软 UI 磁贴存档在 media/versions/v1-soft-ui/ */

:root {
  /* 面 */
  --page: #eaecee;
  --glass: rgba(255, 255, 255, .74);
  --glass-2: rgba(255, 255, 255, .5);
  --edge: rgba(255, 255, 255, .92);
  --hair: rgba(20, 22, 26, .1);
  --hair-strong: rgba(20, 22, 26, .2);

  /* 字色只三档，别再加 */
  --ink: #14161a;
  --mute: #6f757d;
  --faint: #9ba1a8;

  --dark: #15171b;
  --on-dark: #f7f8f8;
  --amber: #e2900f;

  /* 阴影只两档 */
  --sh-1: 0 1px 2px rgba(20, 22, 26, .04);
  --sh-2: 0 1px 2px rgba(20, 22, 26, .04), 0 12px 32px rgba(20, 22, 26, .08);

  /* 圆角只两档 */
  --r-md: 14px;
  --r-lg: 20px;

  /* 间距 8pt 阶梯 */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  /* 字号只五档 */
  --t-hero: 28px;
  --t-h1: 20px;
  --t-h2: 15px;
  --t-body: 13px;
  --t-note: 11px;

  --font: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --num: "SF Mono", ui-monospace, "PingFang SC", monospace;
}

body.vscode-dark {
  --page: #191b1e;
  --glass: rgba(255, 255, 255, .062);
  --glass-2: rgba(255, 255, 255, .035);
  --edge: rgba(255, 255, 255, .11);
  --hair: rgba(255, 255, 255, .11);
  --hair-strong: rgba(255, 255, 255, .24);
  --ink: #eef0f2;
  --mute: #949aa1;
  --faint: #6e747b;
  --dark: #eef0f2;
  --on-dark: #17191b;
  --amber: #f0a83a;
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .38);
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.7;              /* 中文要更松 */
  letter-spacing: 0;             /* 中文不收字距 */
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* 光纹压得比上一版淡，别糊住文字 */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(112deg, transparent 36%, rgba(226,144,15,.10) 45%, rgba(255,255,255,.42) 50%, rgba(226,144,15,.07) 55%, transparent 64%),
    radial-gradient(60% 40% at 6% 8%, rgba(255,255,255,.6), transparent 70%);
}
body.vscode-dark::before { opacity: .42; }
#app { position: relative; z-index: 1; }

* { box-sizing: border-box; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* 数字用等宽，紧一点，才有仪表感 */
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* 统一的磨砂面 */
.pane {
  background: var(--glass);
  border: 1px solid var(--hair);
  border-top-color: var(--edge);
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  backdrop-filter: blur(20px) saturate(1.3);
}
.pane.raised { box-shadow: var(--sh-2); }

/* 类型图标：圆角方框 + 单字，单色 */
.badge {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  border: 1px solid var(--hair);
  background: var(--glass-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  line-height: 1;
  font-weight: 600;
  color: var(--mute);
  flex: none;
}
.badge.pitfall { color: var(--amber); border-color: rgba(226,144,15,.42); }

.pill {
  border: 1px solid transparent;
  background: transparent;
  color: var(--mute);
  border-radius: 999px;
  padding: 5px var(--s3);
  font-size: var(--t-note);
  line-height: 1.4;
  white-space: nowrap;
}
.pill:hover { color: var(--ink); }
.pill.on {
  background: var(--glass);
  border-color: var(--hair);
  color: var(--ink);
  font-weight: 600;
}

.go {
  border: 0;
  background: var(--dark);
  color: var(--on-dark);
  border-radius: 999px;
  padding: 9px var(--s4);
  font-size: var(--t-note);
  font-weight: 600;
  line-height: 1.4;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.go::after { content: "→"; }
.go.plain::after { content: none; }
.ghost {
  background: var(--glass);
  border: 1px solid var(--hair);
  color: var(--ink);
  border-radius: 999px;
  padding: 9px var(--s4);
  font-size: var(--t-note);
  line-height: 1.4;
}
.ghost:hover { border-color: var(--hair-strong); }

/* 首次使用引导：没指目录、或目录里还没有卡片时显示 */
.onboard { padding: var(--s5) var(--s4); }
.onboard h3 {
  margin: 0 0 var(--s2);
  font-size: var(--t-h2);
  font-weight: 600;
  line-height: 1.5;
}
.onboard p {
  margin: 0 0 var(--s4);
  color: var(--mute);
  font-size: var(--t-note);
  line-height: 1.75;
}
.onboard .acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
.onboard code {
  font-family: var(--num);
  font-size: 10px;
  background: var(--glass-2);
  border: 1px solid var(--hair);
  border-radius: 6px;
  padding: 1px 5px;
  word-break: break-all;
}
/* 格式说明里的短 code 不许断词，否则窄侧栏里会裂成两半 */
.onboard .fmt code { word-break: keep-all; white-space: nowrap; }
.onboard .fmt {
  margin: var(--s4) 0 0;
  padding-top: var(--s4);
  border-top: 1px solid var(--hair);
  color: var(--faint);
}

body { padding: var(--s5) var(--s5) var(--s6); }

/* 顶栏 */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s2) var(--s2) var(--s4);
  border-radius: 999px;
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--t-h2);
  font-weight: 600;
  margin-right: var(--s2);
}
.brand i { color: var(--amber); font-style: normal; font-size: var(--t-note); }
.nav { display: flex; gap: var(--s1); flex-wrap: wrap; }
.topbar .search {
  margin-left: auto;
  border: 1px solid var(--hair);
  background: var(--glass-2);
  border-radius: 999px;
  padding: 7px var(--s4);
  font-size: var(--t-note);
  line-height: 1.5;
  outline: none;
  min-width: 190px;
}
.topbar .search::placeholder { color: var(--faint); }

/* bento */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  grid-auto-rows: minmax(170px, auto);
  gap: var(--s4);
}
.card {
  padding: var(--s5);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.card:hover { border-color: var(--hair-strong); box-shadow: var(--sh-2); }
.card.feature { grid-column: span 2; grid-row: span 2; }
.card.wide { grid-column: span 2; }

.top { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s4); }
.kind { font-size: var(--t-note); color: var(--mute); }
.when { font-size: var(--t-note); color: var(--faint); margin-left: auto; }

.name {
  font-size: var(--t-h2);
  font-weight: 600;
  line-height: 1.55;
  margin-bottom: var(--s3);
}
.card.feature .name {
  font-size: var(--t-hero);
  line-height: 1.4;
  margin-bottom: var(--s4);
}
.gist {
  font-size: var(--t-note);
  color: var(--mute);
  line-height: 1.8;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card.feature .gist { font-size: var(--t-body); -webkit-line-clamp: 7; }
.card.feature .gist.why {
  margin-top: var(--s4);
  padding-top: var(--s4);
  border-top: 1px solid var(--hair);
  font-size: var(--t-note);
  -webkit-line-clamp: 4;
}
.card.feature .gist.why b {
  display: block;
  color: var(--faint);
  font-weight: 600;
  margin-bottom: var(--s1);
}

.tags { margin-top: auto; padding-top: var(--s4); display: flex; gap: var(--s2); flex-wrap: wrap; }
.tag {
  border: 1px solid var(--hair);
  background: transparent;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: var(--t-note);
  line-height: 1.4;
  color: var(--faint);
}
.tag:hover { color: var(--ink); border-color: var(--hair-strong); }

/* 底部条 */
.cta {
  margin-top: var(--s4);
  padding: var(--s5);
  border-radius: var(--r-lg);
  display: flex;
  align-items: center;
  gap: var(--s4);
  flex-wrap: wrap;
}
.cta .badge { width: 32px; height: 32px; border-radius: 10px; font-size: var(--t-body); }
.cta .txt { min-width: 0; }
.cta .t1 { font-size: var(--t-h2); font-weight: 600; line-height: 1.5; }
.cta .t2 { font-size: var(--t-note); color: var(--faint); line-height: 1.6; }
.cta .acts { margin-left: auto; display: flex; gap: var(--s2); }

/* 详情 */
.detail {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: rgba(20, 22, 26, .32);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: var(--s6) var(--s5);
  overflow: auto;
}
.detail.on { display: flex; }
.sheet {
  width: min(600px, 100%);
  border-radius: var(--r-lg);
  padding: var(--s5);
  box-shadow: var(--sh-2);
  background: var(--page);
}
.sheet h2 {
  margin: 0 0 var(--s4);
  font-size: var(--t-h1);
  font-weight: 600;
  line-height: 1.5;
}
.sheet .lead {
  margin: 0;
  border-left: 2px solid var(--amber);
  padding-left: var(--s4);
  font-size: var(--t-body);
  line-height: 1.85;
  white-space: pre-wrap;
}
.sheet h3 {
  margin: var(--s5) 0 var(--s2);
  font-size: var(--t-note);
  font-weight: 600;
  color: var(--faint);
}
.sheet p { margin: 0; white-space: pre-wrap; line-height: 1.85; font-size: var(--t-body); }
.actions { display: flex; gap: var(--s2); margin-top: var(--s5); }

.empty {
  grid-column: 1 / -1;
  color: var(--mute);
  padding: var(--s6);
  text-align: center;
  font-size: var(--t-note);
  line-height: 1.9;
  border: 1px dashed var(--hair);
  border-radius: var(--r-lg);
}

@media (max-width: 720px) {
  body { padding: var(--s4) var(--s3) var(--s5); }
  .card.feature, .card.wide { grid-column: span 1; }
  .card { padding: var(--s4); }
  .card.feature .name { font-size: var(--t-h1); }
}


.demobar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 16px;
  font-size: 11px;
  color: var(--mute);
  background: var(--glass);
  border-bottom: 1px solid var(--hair);
  backdrop-filter: blur(20px);
}
.demobar b { color: var(--ink); font-weight: 600; }
.demobar .sep { color: var(--faint); }
.demobar a { color: var(--mute); text-decoration: none; border-bottom: 1px solid var(--hair); }
.demobar a:hover, .demobar a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.demobar .right { margin-left: auto; }
body.bare .demobar { display: none; }

</style>
</head>
<body>
<header class="demobar">
  <b>Personal KB</b>
  <span class="sep">示例数据，可以随便点</span>
  <span class="right">
    <a href="./" aria-current="page">卡片墙</a>
    ·
    <a href="./sidebar.html" >统计侧栏</a>
    ·
    <a href="https://github.com/Rebecia/rebekah-s-home/tree/main/personal-kb-vscode">安装与源码</a>
  </span>
</header>
<div id="app"></div>
<script>
// 拍图时 ?bare=1 隐藏说明栏
if (new URLSearchParams(location.search).has('bare')) document.body.classList.add('bare');
</script>
<script>
// demo 里没有宿主，桩掉 VS Code API；点「打开原文」只弹提示
window.acquireVsCodeApi = () => ({
  postMessage: m => { if (m && m.type === 'open') alert('在插件里会打开这张卡的 Markdown 原文'); }
});
</script>
<script>
const vscode = acquireVsCodeApi();
const TYPE_LABEL = {
  thinking: '思考',
  fundamentals: '基本功',
  idea: 'Idea',
  pitfall: '易错',
  life: '人生',
  glossary: '术语'
};
const TYPE_CHAR = {
  thinking: '思',
  fundamentals: '基',
  idea: 'i',
  pitfall: '错',
  life: '生',
  glossary: '术'
};

let state = { cards: [], stats: {}, connectors: [], kbPath: '', filterType: 'all', query: '' };
let openId = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function visible() {
  const q = (state.query || '').trim().toLowerCase();
  return (state.cards || []).filter(c => {
    if (state.filterType !== 'all' && c.type !== state.filterType) return false;
    if (!q) return true;
    return [c.title, c.conclusion, (c.tags || []).join(' '), c.source].join(' ').toLowerCase().includes(q);
  });
}

function badge(c) {
  return `<div class="badge ${esc(c.type)}">${esc(TYPE_CHAR[c.type] || '卡')}</div>`;
}

function head(c) {
  return `<div class="top">
    ${badge(c)}
    <span class="kind">${esc(TYPE_LABEL[c.type] || c.type)}</span>
    <span class="when num">${esc(c.created)}</span>
  </div>`;
}

/* 第一张放大成 feature，第四张横跨两列，其余常规 —— bento 的节奏 */
function tile(c, i) {
  const size = i === 0 ? 'feature' : (i === 3 ? 'wide' : '');
  const tags = (c.tags || []).slice(0, 3).map(t => `<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  // feature 卡地方大，多给一段「为什么重要」，否则下半张是空的
  const extra = size === 'feature' && c.why
    ? `<div class="gist why"><b>为什么重要</b>${esc(c.why)}</div>`
    : '';
  return `<article class="pane card ${size}" data-id="${esc(c.id)}">
    ${head(c)}
    <div class="name">${esc(c.title)}</div>
    <div class="gist">${esc(c.conclusion)}</div>
    ${extra}
    ${tags ? `<div class="tags">${tags}</div>` : ''}
  </article>`;
}

function sheet(c) {
  return `<div class="detail on">
    <div class="pane sheet">
      ${head(c)}
      <h2>${esc(c.title)}</h2>
      <p class="lead">${esc(c.conclusion || '—')}</p>
      <h3>为什么重要</h3><p>${esc(c.why || '—')}</p>
      <h3>怎么用</h3><p>${esc(c.how || '—')}</p>
      <h3>反例 / 易错点</h3><p>${esc(c.pitfall || '—')}</p>
      <h3>来源</h3><p>${esc(c.origin || c.source || '—')}</p>
      <div class="actions">
        <button class="go" data-open="${esc(c.id)}">打开原文</button>
        <button class="ghost" data-close="1">关闭</button>
      </div>
    </div>
  </div>`;
}

function onboard() {
  return `<section class="pane onboard" style="grid-column: 1 / -1">
    <h3>${state.kbExists ? '这个文件夹里还没有卡片' : '先指一个卡片目录'}</h3>
    <p>卡片就是一批 Markdown 文件。现在读的是 <code>${esc(state.kbPath || '')}</code></p>
    <div class="acts">
      <button class="go" data-cmd="personalKb.pickKbFolder">选择卡片目录</button>
      <button class="ghost" data-cmd="personalKb.createSampleCard">创建示例卡片</button>
    </div>
    <p class="fmt">每张卡片一个文件：frontmatter 写 <code>title</code> / <code>type</code> / <code>tags</code> / <code>created</code>，正文写「结论 / 为什么重要 / 怎么用 / 反例」。用 Comate 的话，在对话里说「沉淀这次」也会自动往这里长卡片。</p>
  </section>`;
}

function render() {
  const cards = visible();
  const stats = state.stats || {};
  const nav = ['all', 'thinking', 'fundamentals', 'idea', 'pitfall', 'life', 'glossary']
    .map(t => `<button class="pill ${state.filterType === t ? 'on' : ''}" data-filter="${t}">${t === 'all' ? '全部' : TYPE_LABEL[t]}</button>`)
    .join('');
  const grid = !(state.cards || []).length
    ? onboard()
    : cards.length
      ? cards.map(tile).join('')
      : `<div class="empty">这个分类还没有卡片。<br>换个筛选，或者清空搜索词。</div>`;
  const current = (state.cards || []).find(c => c.id === openId);
  const obsidian = (state.connectors || []).find(c => c.id === 'obsidian') || {};
  const keepFocus = document.activeElement && document.activeElement.classList.contains('search');

  document.getElementById('app').innerHTML = `
    <div class="pane topbar">
      <span class="brand"><i>◆</i> Personal KB</span>
      <div class="nav">${nav}</div>
      <input class="search" placeholder="搜索标题、结论、标签" value="${esc(state.query || '')}">
    </div>

    <div class="grid">${grid}</div>

    <div class="pane cta">
      <div class="badge">◆</div>
      <div class="txt">
        <div class="t1">${stats.total || 0} 张卡片，本周新写 ${stats.createdThisWeek || 0} 张</div>
        <div class="t2">Obsidian ${obsidian.linked ? '已连接，卡片同一份文件' : '未连接'} · ${esc(state.kbPath || '')}</div>
      </div>
      <div class="acts">
        <button class="go" data-link="obsidian">${obsidian.linked ? '重新连接 Obsidian' : '连接 Obsidian'}</button>
      </div>
    </div>

    ${current ? sheet(current) : ''}
  `;

  if (keepFocus) {
    const input = document.querySelector('.search');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  if (!(t instanceof HTMLElement)) return;
  const btn = t.closest('button');
  if (btn) {
    if (btn.dataset.cmd) { vscode.postMessage({ type: 'cmd', id: btn.dataset.cmd }); return; }
    if (btn.dataset.filter) { state.filterType = btn.dataset.filter; render(); return; }
    if (btn.dataset.tag) { state.query = btn.dataset.tag; state.filterType = 'all'; render(); return; }
    if (btn.dataset.close) { openId = null; render(); return; }
    if (btn.dataset.open) { vscode.postMessage({ type: 'open', id: btn.dataset.open }); return; }
    if (btn.dataset.link === 'obsidian') { vscode.postMessage({ type: 'linkObsidian' }); return; }
  }
  if (t.classList.contains('detail')) { openId = null; render(); return; }
  const hit = t.closest('.card');
  if (hit && hit.dataset.id) { openId = hit.dataset.id; render(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t instanceof HTMLInputElement && t.classList.contains('search')) {
    state.query = t.value;
    render();
  }
});

window.addEventListener('message', event => {
  if (event.data?.type !== 'render') return;
  state = Object.assign({ filterType: state.filterType || 'all', query: state.query || '' }, event.data.payload);
  render();
});

vscode.postMessage({ type: 'ready' });

</script>
