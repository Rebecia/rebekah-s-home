name: personal-kb CI

# GitHub 只认仓库根的 .github/workflows/，子目录里的 workflow 不会跑。
on:
  push:
    branches: [main]
    paths: ['personal-kb-vscode/**', '.github/workflows/personal-kb-ci.yml']
  pull_request:
    paths: ['personal-kb-vscode/**', '.github/workflows/personal-kb-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-kb-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: personal-kb-vscode/*.vsix
